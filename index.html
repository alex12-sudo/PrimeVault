<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeVault - Las Mejores Ofertas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding-bottom: 3rem; }
        
        header { background: #1e293b; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #f59e0b; }
        nav { display: flex; gap: 0.5rem; align-items: center; }
        nav button { background: #334155; border: none; color: white; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }
        nav button.active { background: #f59e0b; color: black; font-weight: bold; }
        .btn-admin { background: #2563eb !important; color: white !important; font-weight: bold; }
 
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
 
        /* Panel Admin */
        #adminPanel { background: #1e293b; border: 2px solid #2563eb; border-radius: 8px; padding: 1.5rem; margin-bottom: 2rem; display: none; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.3rem; }
        .form-group input, .form-group select { background: #0f172a; border: 1px solid #334155; color: white; padding: 0.5rem; border-radius: 4px; }
        .btn-save { background: #10b981; color: white; font-weight: bold; border: none; padding: 0.7rem; border-radius: 6px; cursor: pointer; grid-column: 1 / -1; margin-top: 1rem; }
 
        /* Productos Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
        .card { background: #1e293b; border-radius: 8px; border: 1px solid #334155; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .card-media { width: 100%; height: 200px; object-fit: cover; background: #000; }
        .card-content { padding: 1rem; display: flex; flex-direction: column; flex-grow: 1; }
        .badge { background: #f59e0b; color: black; font-size: 0.75rem; font-weight: bold; padding: 0.2rem 0.4rem; border-radius: 4px; align-self: flex-start; margin-bottom: 0.5rem; }
        .title { font-size: 1rem; font-weight: bold; margin-bottom: 0.5rem; color: white; }
        .price-container { margin: 0.5rem 0 1rem 0; }
        .price { font-size: 1.3rem; font-weight: bold; color: #4ade80; }
        .old-price { font-size: 0.85rem; text-decoration: line-through; color: #94a3b8; margin-left: 0.5rem; }
        .btn-buy { background: #f59e0b; color: black; text-decoration: none; text-align: center; font-weight: bold; padding: 0.6rem; border-radius: 6px; display: block; margin-top: auto; }
        .btn-del { position: absolute; top: 8px; right: 8px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 26px; height: 26px; cursor: pointer; display: none; }
        .admin-active .btn-del { display: block; }
        .empty-msg { grid-column: 1 / -1; text-align: center; color: #94a3b8; padding: 3rem; font-size: 1.1rem; }
    </style>
</head>
<body>
 
    <header>
        <div class="logo">PrimeVault</div>
        <nav>
            <button onclick="filtrar(event, 'todos')" class="active">Todos</button>
            <button onclick="filtrar(event, 'tech')">Tecnología</button>
            <button onclick="filtrar(event, 'hogar')">Hogar</button>
            <button class="btn-admin" onclick="pedirPassword()">⚙️ Panel Admin</button>
        </nav>
    </header>
 
    <div class="container">
        <!-- Panel Administrador -->
        <div id="adminPanel">
            <h3>Añadir Nuevo Producto o Vídeo</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" id="pTitle" placeholder="Ej: Cepillo Oral-B iO5">
                </div>
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="pCat">
                        <option value="tech">Tecnología</option>
                        <option value="hogar">Hogar</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ASIN o Link de Amazon</label>
                    <input type="text" id="pAsin" placeholder="B08B5B2QCZ">
                </div>
                <div class="form-group">
                    <label>Precio (€)</label>
                    <input type="number" step="0.01" id="pPrice" placeholder="99.95">
                </div>
                <div class="form-group">
                    <label>Precio Anterior (€)</label>
                    <input type="number" step="0.01" id="pOldPrice" placeholder="136.91">
                </div>
                <div class="form-group">
                    <label>Etiqueta</label>
                    <input type="text" id="pBadge" placeholder="Oferta Flash">
                </div>
                <div class="form-group">
                    <label>URL Imagen o Vídeo</label>
                    <input type="text" id="pMedia" placeholder="https://... o enlace mp4">
                </div>
                <div class="form-group">
                    <label>¿Es Vídeo?</label>
                    <select id="pIsVideo">
                        <option value="false">No (Imagen)</option>
                        <option value="true">Sí (Vídeo MP4)</option>
                    </select>
                </div>
                <button class="btn-save" type="button" onclick="guardarProducto()">+ Añadir a la Web</button>
            </div>
        </div>
 
        <!-- Grid de Productos -->
        <div class="grid" id="grid"></div>
    </div>
 
    <script>
        const AFILIADO_TAG = "alex12su-21";
        const ADMIN_PASSWORD = "mi_clave_1234";
 
        function obtenerProductos() {
            try {
                return JSON.parse(localStorage.getItem('pv_prods')) || [];
            } catch(e) {
                return [];
            }
        }
 
        function guardarProductosEnStorage(prods) {
            localStorage.setItem('pv_prods', JSON.stringify(prods));
        }
 
        let categoriaActual = 'todos';
 
        function render() {
            const grid = document.getElementById('grid');
            if (!grid) return;
            grid.innerHTML = '';
            
            const productos = obtenerProductos();
            const filtrados = categoriaActual === 'todos'
                ? productos
                : productos.filter(p => p.cat === categoriaActual);
 
            if (filtrados.length === 0) {
                grid.innerHTML = `<div class="empty-msg">No hay productos añadidos todavía. Abre el Panel Admin para añadir el primero.</div>`;
                return;
            }
 
            filtrados.forEach(p => {
                const link = p.asin && p.asin.startsWith('http')
                    ? p.asin
                    : `https://www.amazon.es/dp/${p.asin || 'B000000000'}?tag=${AFILIADO_TAG}`;
 
                const mediaHTML = p.isVideo
                    ? `<video class="card-media" controls><source src="${p.media}" type="video/mp4"></video>`
                    : `<img class="card-media" src="${p.media || ''}" alt="${p.title}" onerror="this.src='https://via.placeholder.com/300x200?text=Sin+Imagen'">`;
 
                grid.innerHTML += `
                    <div class="card">
                        <button class="btn-del" onclick="eliminar(${p.id})">✕</button>
                        ${mediaHTML}
                        <div class="card-content">
                            ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
                            <div class="title">${p.title}</div>
                            <div class="price-container">
                                <span class="price">${p.price} €</span>
                                ${p.oldPrice ? `<span class="old-price">${p.oldPrice} €</span>` : ''}
                            </div>
                            <a href="${link}" target="_blank" class="btn-buy">Comprar en Amazon</a>
                        </div>
                    </div>
                `;
            });
        }
 
        function pedirPassword() {
            const clave = prompt("Introduce la contraseña de Administrador:");
            if (clave === ADMIN_PASSWORD) {
                const panel = document.getElementById('adminPanel');
                document.body.classList.toggle('admin-active');
                panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            } else if (clave !== null) {
                alert("Contraseña incorrecta");
            }
        }
 
        function guardarProducto() {
            const title = document.getElementById('pTitle').value;
            const cat = document.getElementById('pCat').value;
            const asin = document.getElementById('pAsin').value;
            const price = parseFloat(document.getElementById('pPrice').value);
            const oldPrice = parseFloat(document.getElementById('pOldPrice').value);
            const badge = document.getElementById('pBadge').value;
            const media = document.getElementById('pMedia').value;
            const isVideo = document.getElementById('pIsVideo').value === 'true';
 
            const nuevo = {
                id: Date.now(),
                title: title || 'Producto sin nombre',
                cat: cat,
                asin: asin || 'B000000000',
                price: isNaN(price) ? 0 : price,
                oldPrice: isNaN(oldPrice) ? null : oldPrice,
                badge: badge,
                media: media,
                isVideo: isVideo
            };
 
            let productos = obtenerProductos();
            productos.unshift(nuevo);
            guardarProductosEnStorage(productos);
            
            render();
 
            // Limpiar campos del formulario
            document.getElementById('pTitle').value = '';
            document.getElementById('pAsin').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pOldPrice').value = '';
            document.getElementById('pBadge').value = '';
            document.getElementById('pMedia').value = '';
            
            alert("¡Producto añadido y guardado con éxito!");
        }
 
        function eliminar(id) {
            if (confirm("¿Seguro que quieres borrar este producto?")) {
                let productos = obtenerProductos();
                productos = productos.filter(p => p.id !== id);
                guardarProductosEnStorage(productos);
                render();
            }
        }
 
        function filtrar(evt, cat) {
            categoriaActual = cat;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active')
